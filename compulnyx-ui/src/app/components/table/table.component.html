
<div class="container mt-5">
  <h3 class="mb-4">Student List</h3>
  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-primary text-center">
        <tr>
          <th>Student ID</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>DOB</th>
          <th>Class</th>
          <th>Score</th>
          <th>Status</th>
          <th>Photo</th>
        </tr>
      </thead>
      <tbody class="text-center">
        @for (student of students; track $index) {
          <tr>
          <td>{{ student.studentId }}</td>
          <td>{{ student.firstName }}</td>
          <td>{{ student.lastName }}</td>
          <td>{{ student.dob | date:'mediumDate' }}</td>
          <td>{{ student.class }}</td>
          <td>{{ student.score }}</td>
          <td>
            <span [ngClass]="{
              'badge bg-success': student.status === 'Active',
              'badge bg-secondary': student.status !== 'Active'
            }">
              {{ student.status }}
            </span>
          </td>
          <td>
            <img
              src="https://ui-avatars.com/api/?name={{student.firstName}}+{{student.lastName}}&background=random"
              class="rounded-circle"
              width="40"
              height="40"
              alt="avatar"
            />
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
