<div class="row mb-3">
  <div class="col-md-3">
    <input type="number" class="form-control" placeholder="Search by Student ID"
           [(ngModel)]="filters.studentId" (ngModelChange)="loadStudents()" />
  </div>
  <div class="col-md-3">
    <select class="form-control" [(ngModel)]="filters.className" (change)="loadStudents()">
      <option value="">All Classes</option>
      <option *ngFor="let c of classOptions" [value]="c">{{ c }}</option>
    </select>
  </div>
  <div class="col-md-3">
    <input type="date" class="form-control" [(ngModel)]="filters.startDob" (change)="loadStudents()" />
  </div>
  <div class="col-md-3">
    <input type="date" class="form-control" [(ngModel)]="filters.endDob" (change)="loadStudents()" />
  </div>
</div>


<!-- Pagination and Export feature  -->

<div class="d-flex justify-content-between align-items-center mb-2">
  <div>
    Showing page {{ page + 1 }}
  </div>
  <div>
    <button class="btn btn-outline-success" (click)="exportToExcel()">Export to Excel</button>
    <button class="btn btn-outline-primary" (click)="previousPage()" [disabled]="page === 0">Previous</button>
    <button class="btn btn-outline-primary" (click)="nextPage()">Next</button>
  </div>
</div>
